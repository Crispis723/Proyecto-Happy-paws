<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Paws Veterinary Clinic</title>
  <!-- Rutas corregidas -->
  <link rel="stylesheet" href="/styles/styles.css">
  <link rel="stylesheet" href="/styles/stylescolor.css">

  <link href="data:image/x-icon;base64," rel="icon" type="image/x-icon" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />
  <link
    href="https://fonts.googleapis.com/css2?family=Krona+One&family=Montserrat:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
</head>

<body class="bg-[var(--background-color)] text-[var(--text-primary)]">
  <div class="flex flex-col min-h-screen">
    <!-- HEADER -->
    <header class="bg-[var(--primary-color)] shadow-md">
      <nav class="container mx-auto px-6 py-4 flex justify-between items-center max-w-screen-xl">
        <a href="#" class="flex items-center space-x-4">
          <img src="/logo.jpg" alt="Happy Paws Logo" class="h-16 w-auto max-w-full">
          <span class="text-white text-2xl font-heading">Happy Paws</span>
        </a>
        <div class="hidden md:flex items-center space-x-8">
          <a class="text-white hover:text-[var(--accent-color)] font-medium transition-colors duration-200"
            href="#">Home</a>
          <a class="text-white hover:text-[var(--accent-color)] font-medium transition-colors duration-200"
            href="login_html">Login</a>
          <a class="text-white hover:text-[var(--accent-color)] font-medium transition-colors duration-200"
            href="#">Our Services</a>
          <a class="text-white hover:text-[var(--accent-color)] font-medium transition-colors duration-200"
            href="about.html">About Us</a>
          <a class="text-white hover:text-[var(--accent-color)] font-medium transition-colors duration-200"
            href="contact_us.html">Contact Us</a>
          <a class="bg-[var(--secondary-color)] text-white py-2 px-4 rounded-md font-semibold hover:bg-opacity-90 transition-colors duration-200"
            href="#">Book an Appointment</a>
        </div>
        <!-- Botón hamburguesa -->
        <button class="md:hidden text-white">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg">
            <path d="M4 6h16M4 12h16m-7 6h7" stroke-linecap="round" stroke-linejoin="round"
              stroke-width="2"></path>
          </svg>
        </button>
      </nav>
    </header>

    <!-- MAIN -->
    <main class="flex-grow">
      <section class="relative bg-white py-16 md:py-24">
        <div class="container mx-auto px-6 flex flex-col md:flex-row items-center max-w-screen-xl">
          <div class="md:w-1/2 mb-10 md:mb-0">
            <h1
              class="font-heading text-4xl md:text-6xl font-bold text-[var(--text-primary)] leading-tight mb-4">
              Welcome to Happy Paws Veterinary Clinic</h1>
            <p class="text-lg text-gray-700 mb-8">Your trusted partner in pet care, dedicated to providing
              compassionate and comprehensive services.</p>
            <div class="flex space-x-4">
              <a class="bg-[var(--secondary-color)] text-white py-3 px-6 rounded-md font-semibold hover:bg-opacity-90 transition-colors duration-200"
                href="#">Book an Appointment</a>
              <a class="bg-[var(--primary-color)] text-white py-3 px-6 rounded-md font-semibold hover:bg-opacity-90 transition-colors duration-200"
                href="#">Learn About Our Services</a>
            </div>
          </div>
          <div class="md:w-1/2">
            <img alt="Veterinarian with a pet" class="rounded-lg shadow-2xl w-full max-w-md mx-auto"
              src="https://lh3.googleusercontent.com/aida-public/AB6AXuDNSBLbBJDBqEJKgQE1K7dnm4_txk3jcu9ndDtfm6P4HgvRdlrFeolSYLfLr6vog8adHEEMtfuFBC_ysKvH1nTe97u7XRhgY9M1EMEKRuI1FTLZj0qIMYKK8FjP9DW5SAJ4jk4VThB48LVr2URbBxDX2YysTjwyv6z-47b_GXYSJCzXwbVjts-zkEBj-2vsDsaz1bgEFxidvNpsMA0w5O8nBAW5p-yose54DT7A2gSFutuwUZMLRwrzZKs9YERpDr09slVUfOeSHwc" />
          </div>
        </div>
      </section>

      <!-- SERVICES -->
      <section class="bg-white py-12 md:py-20">
        <div class="container mx-auto px-6 max-w-screen-xl">
          <h2
            class="font-heading text-3xl md:text-4xl font-bold text-[var(--text-primary)] text-center mb-12">
            Our Services</h2>
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
            <!-- Aquí siguen tus cards de servicios -->
          </div>
        </div>
      </section>
    </main>

    <!-- FOOTER -->
    <footer class="bg-[var(--text-secondary)] text-white">
      <div class="container mx-auto px-6 py-12 max-w-screen-xl">
        <!-- contenido footer -->
      </div>
    </footer>
  </div>
</body>
</html>
