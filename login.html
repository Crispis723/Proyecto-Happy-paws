<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Happy Paws | Iniciar Sesión</title>
  <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
  <main class="wrapper" role="main" aria-labelledby="page-title">
    <header class="brand" aria-label="Happy Paws">
      <img src="logo.jpg" alt="Happy Paws" class="logo">
      <span class="name">Happy Paws</span>
    </header>

    <section class="card fade-in">
      <h1 id="page-title">Iniciar Sesión</h1>
      <form action="/login" method="post">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required>

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="****" required>

        <button type="submit" class="btn">Ingresar</button>
      </form>
      <div class="links">
        <p><a href="recover_password.html">¿Olvidaste tu contraseña?</a></p>
        <p>¿No tienes cuenta? <a href="/register">Regístrate</a></p>
      </div>
    </section>
  </main>
</body>
</html>
