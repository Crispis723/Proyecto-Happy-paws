<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Happy Paws | Crear Cuenta</title>

    <head>
        <!-- Estilos generales -->
        <link rel="stylesheet" href="styles/styles.css">

        <!-- Estilos de color -->
        <link rel="stylesheet" href="styles/stylescolor.css">
    </head>

</head>

<body>
    <main class="wrapper" role="main" aria-labelledby="page-title">
        <header class="brand" aria-label="Happy Paws">
            <img src="logo.jpg" alt="Happy Paws" class="logo">
            <span class="name">Happy Paws</span>
        </header>

        <section class="card fade-in">
            <h1 id="page-title">Crear Cuenta</h1>
            <form action="/register" method="post">
                <label for="name">Nombre completo</label>
                <input type="text" id="name" name="name" placeholder="Tu nombre" required>

                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required>

                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>

                <label for="confirm-password">Confirmar contraseña</label>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="••••••••" required>

                <button type="submit" class="btn">Crear cuenta</button>
            </form>
            <div class="links">
                <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
            </div>
        </section>
    </main>
</body>

</html>
